
name: Build Onboard H&S Windows App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: onboard-hs-desktop-v4

    steps:
      - name: Get dashboard files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript
        run: npm run test:syntax

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Save Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Onboard-HS-Windows-Installer
          path: onboard-hs-desktop-v4/dist/*.exe
          if-no-files-found: error
          retention-days: 30
