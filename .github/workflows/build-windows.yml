
name: Build Onboard H&S Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'onboard-hs-desktop-v4/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Get dashboard files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: onboard-hs-desktop-v4
        run: npm install --no-audit --no-fund

      - name: Check JavaScript
        working-directory: onboard-hs-desktop-v4
        run: npm run test:syntax

      - name: Test updater
        working-directory: onboard-hs-desktop-v4
        run: node --test updates.test.js

      - name: Generate branded Windows icons
        working-directory: onboard-hs-desktop-v4
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/make_icon.py
          python -c "from PIL import Image; p=Image.open('build/icon.ico'); assert p.format=='ICO' and p.size==(256,256)"

      - name: Test section PIN security
        working-directory: onboard-hs-desktop-v4
        run: npm run test:pin

      - name: Regression-test all dashboard sections
        working-directory: onboard-hs-desktop-v4
        run: npm run test:dashboard

      - name: Test Windows storage and automatic backups
        working-directory: onboard-hs-desktop-v4
        run: npm run test:storage

      - name: Validate automatic publisher scripts
        shell: pwsh
        run: |
          foreach ($file in @('onboard-hs-desktop-v4/tools/Publish-PrivateUpdate.ps1', 'onboard-hs-desktop-v4/tools/Install-UpdatePublisher.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$file : $_" }
              throw "PowerShell publisher validation failed: $file"
            }
          }

      - name: Test direct GitHub desktop updates
        working-directory: onboard-hs-desktop-v4
        run: npm run test:github-updates

      - name: Build Windows installer
        working-directory: onboard-hs-desktop-v4
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prepare private update manifest
        shell: pwsh
        working-directory: onboard-hs-desktop-v4
        run: |
          $exe = Get-ChildItem -Path dist -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Installer not found' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $manifest = @{
            version = $version
            file = $exe.Name
            size = $exe.Length
            sha256 = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 dist/onboard-hs-update.json

      - name: Save Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Onboard-HS-Windows-Installer
          path: |
            onboard-hs-desktop-v4/dist/*.exe
            onboard-hs-desktop-v4/dist/onboard-hs-update.json
          if-no-files-found: error
          retention-days: 30
